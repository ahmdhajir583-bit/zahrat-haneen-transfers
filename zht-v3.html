<style>
:root{--bg:#f6f4fa;--card:#fff;--tx:#241a2e;--mu:#7a7085;--ln:#e7e2ee;--pu:#6b2c91;--or:#e07b0c;--gr:#5e9e1f;--cy:#1f9bc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#17111d;--card:#211a29;--tx:#f1ecf6;--mu:#a99db5;--ln:#33293d}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Plus Jakarta Sans",system-ui,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
#app{display:flex;height:100%}
aside{width:232px;background:var(--card);border-right:1px solid var(--ln);padding:20px 14px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.lg{background:#fff;border-radius:14px;width:76px;height:76px;display:grid;place-items:center;margin:0 auto 4px;border:1px solid var(--ln)}
.lg img{width:64px;height:64px;object-fit:contain}
.lg.big{width:110px;height:110px}.lg.big img{width:96px;height:96px}
aside h1{font-size:15px;text-align:center;margin:0 0 14px;line-height:1.3}
aside h1 span{color:var(--pu)}
.nv{display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;color:var(--tx);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;text-align:left}
.nv:hover{background:var(--bg)}.nv.on{background:var(--pu);color:#fff}
.bd{background:var(--or);color:#fff;border-radius:99px;font-style:normal;font-size:12px;padding:0 8px;font-weight:700}
.me{margin-top:auto;border-top:1px solid var(--ln);padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.me button{border:0;background:none;color:var(--pu);cursor:pointer;font:inherit;font-weight:700}
main{flex:1;overflow:auto;padding:28px 32px}
main>*{max-width:1080px}
h2{margin:0 0 16px;font-size:22px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:16px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.ac{display:flex;gap:8px;align-items:center}
.mu{color:var(--mu);font-size:13px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 14px}
.tbl th{text-align:left;color:var(--mu);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--ln)}
.tbl td{padding:8px;border-bottom:1px solid var(--ln)}
input,select{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pu);outline-offset:1px}
label{display:block;font-weight:500;margin:0 0 6px}
select{max-width:320px;margin-bottom:14px}
.row{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.btn{background:var(--pu);color:#fff;border:1px solid var(--pu);border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;display:inline-block}
.btn.sec{background:transparent;color:var(--pu);font-weight:500;margin:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:16px}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;color:#fff;white-space:nowrap}
.pill.gr{background:var(--gr)}.pill.or{background:var(--or)}.pill.cy{background:var(--cy)}.pill.gy{background:#8a8194}.pill.bl{background:var(--cy)}.row select{margin:0}.sq{width:72px;padding:5px 8px}.rw{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.rw input,.rw select{width:auto;margin:0;padding:5px 8px}.rw input[data-f2="nt"]{min-width:200px;flex:1}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}.fg input,.fg select{max-width:none;margin:0}.bn{background:#c0392b;color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:16px;cursor:pointer}.gl{font-size:12px;color:var(--mu);margin:12px 12px 2px}.pill.rd{background:#c0392b}.pill.ye{background:#c99a0a}.fl{align-items:center}
.tg{border:1px solid var(--ln);background:transparent;color:var(--tx);padding:5px 12px;border-radius:8px;cursor:pointer;margin-right:6px;font:inherit}
.tg.on{color:#fff}.tg.on.gr{background:var(--gr);border-color:var(--gr)}.tg.on.or{background:var(--or);border-color:var(--or)}.tg.on.bl{background:var(--cy);border-color:var(--cy)}
.err{color:var(--or);margin:6px 0}
.lgn{display:grid;place-items:center;width:100%;padding:20px}
.lgn .card{width:380px;max-width:100%}
.lgn h1{text-align:center;font-size:20px;margin:6px 0 20px}
.lgn select{max-width:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px}
.tile b{font-size:26px;display:block}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bar{display:grid;grid-template-columns:110px 1fr 30px;align-items:center;gap:8px;margin:8px 0}
.bar i{display:block;height:10px;border-radius:6px}
.fl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fl select,.fl input{width:auto;margin:0;max-width:200px}

 else if(a==="lic-ed"){const l=S.lic.find(x=>x.id===b.dataset.id);if(l){lf={...l};lfOpen=true;note=""}}
 else if(a==="lic-rn"){const l=S.lic.find(x=>x.id===b.dataset.id);if(l){lf={id:l.id,renew:true,start:l.end,end:"",num:l.num||""};lfOpen=true;note=""}}
 else if(a==="lic-del"){if(confirm("Delete this license?"))deleteDoc(doc(db,"licenses",b.dataset.id)).catch(e=>alert("Could not delete: "+e.message))}
 else if(a==="lic-wa"){const l=S.lic.find(x=>x.id===b.dataset.id),n=(S.set.wa||"").replace(/\D/g,"");if(!l)return;if(!n){alert("The admin must set the WhatsApp number in Settings first.");return}const d=dl(l.end),m=(S.set.msg||"").replaceAll("{type}",l.type).replaceAll("{holder}",l.holder||l.br||"").replaceAll("{branch}",l.br||"").replaceAll("{end}",l.end).replaceAll("{days}",d<0?"expired "+(-d)+" days ago":d+" days left");window.open("https://wa.me/"+n+"?text="+encodeURIComponent(m),"_blank");return}
 else if(a==="lic-save"){
  const adm=me==="Admin",L0=S.lic.find(x=>x.id===lf.id);
  if(lf.renew){
   if(!L0||!lf.start||!lf.end||lf.end<lf.start){note="Enter valid start and end dates.";return render()}
   updateDoc(doc(db,"licenses",lf.id),{start:lf.start,end:lf.end,num:lf.num||"",hist:[...(L0.hist||[]),{start:L0.start,end:L0.end,ts:Date.now()}]}).catch(e=>alert("Could not save: "+e.message));
  }else{
   const ty=S.set.types.find(x=>x.n===lf.type),bu=adm?lf.bu:meU;
   if(!ty||!bu||!lf.start||!lf.end||lf.end<lf.start||(ty.k==="person"&&!(lf.holder||"").trim())){note="Complete the type, branch, person name (personal licenses) and valid dates.";return render()}
   const d={bu,br:BR[BU.indexOf(bu)],type:ty.n,kind:ty.k,holder:ty.k==="person"?lf.holder.trim():"",num:lf.num||"",start:lf.start,end:lf.end,note:lf.note||"",hist:lf.hist||[]};
   (lf.id?updateDoc(doc(db,"licenses",lf.id),d):addDoc(collection(db,"licenses"),d)).catch(e=>alert("Could not save: "+e.message));
  }
  lfOpen=false;lf={};note=""}
 else if(a==="ty-add"){const v=$("#newty").value.trim();if(v)setSet({types:[...S.set.types,{n:v,k:"branch",d:[10,4,1]}]});return}
 else if(a==="ty-del"){setSet({types:S.set.types.filter((_,i)=>i!==k)});return}
 else if(a==="cancel"&&r){const why=prompt("Reason for cancelling this request?");if(why&&why.trim()){r.cancelled=true;upd(r,{cancelled:true,cancelReason:why.trim(),cancelTs:Date.now()})}}
 else if(a==="rs-add"){const v=$("#newrs").value.trim();if(v)setRs([...S.set.reasons,v]);return}
 else if(a==="rs-del"){setRs(S.set.reasons.filter((_,i)=>i!==k));return}
 else if(a==="rs-up"){const x=[...S.set.reasons];if(k>0){[x[k-1],x[k]]=[x[k],x[k-1]];setRs(x)}return}
 else if(a==="pw"){const p=$("#np").value;if(p.length<6){note="Use at least 6 characters.";return render()}updatePassword(auth.currentUser,p).then(()=>{note="Password changed.";render()}).catch(e=>{note=e.code==="auth/requires-recent-login"?"Please log out, log in again, then retry.":e.message;render()});return}
 else if(a==="copy"){if(navigator.clipboard)navigator.clipboard.writeText(setupOut);return}
 else if(a==="tpl"){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Code","Item name","Quantity"]]),"Transfer");XLSX.writeFile(wb,"transfer-template.xlsx");return}
 else if(a==="export"){exportXlsx((window._F||[]).filter(r=>!r.cancelled));return}
 else if(a==="tab"){tab=b.dataset.v;note=""}
 else if(a==="add")draft.push({c:"",n:"",q:1});
 else if(a==="del")draft.splice(k,1);
 else if(a==="samp")draft=[{c:"1001",n:"Vitamin C Serum 30ml",q:12},{c:"1002",n:"Sunscreen SPF50 50ml",q:8},{c:"1003",n:"Hydrating Cleanser 200ml",q:20}];
 else if(a==="send"){
  const it=draft.filter(i=>(i.c||i.n)&&+i.q>0);
  if(!it.length){note="Add at least one item with a quantity.";return render()}
  const rbn=($("#rby")||{value:""}).value.trim();if(!rbn){note="Enter your name (Requested by).";return render()}
  saveName(rbn);addDoc(collection(db,"requests"),{rb:rbn,from:me,fromU:meU,to:toSel,toU:BU[BR.indexOf(toSel)],day:today(),ts:Date.now(),items:it.map(i=>({c:String(i.c).trim(),n:String(i.n).trim(),q:+i.q,s:"p"})),done:false,hid:false}).catch(e=>alert("Could not send: "+e.message));
  draft=[];note="";tab="req"}
 else if(a==="set"&&r){r.items[k].t=b.dataset.v;upd(r,{items:r.items})}
 else if(a==="all"&&r){r.items.forEach(i=>i.t="d");upd(r,{items:r.items})}
 else if(a==="sub"&&r&&r.items.every(i=>i.t)){const rpn=(document.getElementById("rp-"+r.id)||{value:""}).value.trim();if(!rpn){alert("Please enter your name (Responded by).");return}const bad=r.items.find(i=>i.t==="n"?(!i.rs||(i.rs==="Other"&&!(i.nt||"").trim())):(i.sq!=null&&+i.sq<+i.q&&!(i.nt||"").trim()));if(bad){alert("Please complete: "+bad.c+" "+bad.n+" (choose a reason, or add a note if the sent quantity is lower or the reason is Other).");return}r.items.forEach(i=>{i.s=i.t;i.sq=i.s==="d"?(i.sq==null?i.q:i.sq):0;if(i.s==="d")delete i.rs});r.done=true;r.rp=rpn;saveName(rpn);upd(r,{items:r.items,done:true,doneTs:Date.now(),rp:rpn})}
 else if(a==="hide"&&r){r.hid=true;upd(r,{hid:true})}
 render();
});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="rby"||t.dataset.rp)saveName(t.value);if(t.dataset.lf&&t.tagName!=="SELECT")lf[t.dataset.lf]=t.value;if(t.dataset.f&&draft[+t.dataset.k])draft[+t.dataset.k][t.dataset.f]=t.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="p")document.querySelector('[data-a="in"]').click()});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.f2){const r=S.r.find(x=>x.id===t.dataset.id),it=r&&r.items[+t.dataset.k],f=t.dataset.f2;if(it){it[f]=f==="sq"?Math.max(0,Math.min(+it.q,+t.value||0)):t.value;upd(r,{items:r.items})}}
 else if(t.dataset.rsi!=null){const x=[...S.set.reasons];x[+t.dataset.rsi]=t.value.trim();setRs(x.filter(Boolean))}
 else if(t.dataset.ty!=null){const ty=S.set.types.map(x=>({...x})),x=ty[+t.dataset.ty],f=t.dataset.tf;if(x){if(f==="d")x.d=t.value.split(",").map(s=>parseInt(s,10)).filter(n=>n>=0).slice(0,3);else x[f]=f==="n"?t.value.trim():t.value;setSet({types:ty.filter(y=>y.n)})}}
 else if(t.dataset.set){setSet({[t.dataset.set]:t.value.trim()})}
 else if(t.dataset.lf){lf[t.dataset.lf]=t.value;if(t.tagName==="SELECT")render()}
 else if(t.id==="to"){toSel=t.value}
 else if(t.id&&t.id.startsWith("f_")&&t.id!=="f_x"){flt[t.id.slice(2)]=t.value;render()}
 else if(t.id==="f"&&t.files[0]){
  const rd=new FileReader();
  rd.onload=ev=>{note="";try{
   const wb=XLSX.read(ev.target.result,{type:"array"});
   const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
   rows.forEach((x,i)=>{if(i===0&&isNaN(+x[2]))return;if(x[0]===""&&x[1]==="")return;draft.push({c:String(x[0]).trim(),n:String(x[1]).trim(),q:+x[2]||1})});
  }catch(err){note="Could not read this file. Use an .xlsx or .csv with the columns Code, Item name, Quantity."}render()};
  rd.readAsArrayBuffer(t.files[0]);
 }
});
addEventListener("hashchange",render);
onAuthStateChanged(auth,u=>{
 unsubs.forEach(f=>f());unsubs=[];parts={};S.r=[];S.lic=[];
 if(!u){me=null;meU="";return render()}
 meU=u.email.split("@")[0];me=meU==="admin"?"Admin":BR[BU.indexOf(meU)];
 if(!me){signOut(auth);return}
 tab=me==="Admin"?"dash":"send";
 const col=collection(db,"requests"),er=e=>alert("Could not load data: "+e.message);
 const put=k=>sn=>{parts[k]=sn.docs.map(d=>({...d.data(),id:d.id}));S.r=Object.values(parts).flat().filter((x,j,a)=>a.findIndex(y=>y.id===x.id)===j).sort((a,b)=>b.ts-a.ts);const el=document.activeElement;if(!el||!el.matches("#app input,#app select"))render()};
 unsubs=me==="Admin"?[onSnapshot(col,put("a"),er)]:[onSnapshot(query(col,where("fromU","==",meU)),put("f"),er),onSnapshot(query(col,where("toU","==",meU)),put("t"),er)];
 unsubs.push(onSnapshot(me==="Admin"?collection(db,"licenses"):query(collection(db,"licenses"),where("bu","==",meU)),sn=>{S.lic=sn.docs.map(d=>({...d.data(),id:d.id}));const el=document.activeElement;if(!el||!el.matches("#app input,#app select"))render()},er));
 unsubs.push(onSnapshot(doc(db,"settings","app"),sn=>{if(sn.exists())S.set={...S.set,...sn.data()};const el=document.activeElement;if(!el||!el.matches("#app input,#app select"))render()},er));
 render();
