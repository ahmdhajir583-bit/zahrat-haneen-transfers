<style>
:root{--bg:#f6f4fa;--card:#fff;--tx:#241a2e;--mu:#7a7085;--ln:#e7e2ee;--pu:#6b2c91;--or:#e07b0c;--gr:#5e9e1f;--cy:#1f9bc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17111d;--card:#211a29;--tx:#f1ecf6;--mu:#a99db5;--ln:#33293d}}
:root[data-theme="dark"]{--bg:#17111d;--card:#211a29;--tx:#f1ecf6;--mu:#a99db5;--ln:#33293d}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Plus Jakarta Sans",system-ui,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
#app{display:flex;height:100%}
aside{width:232px;background:var(--card);border-right:1px solid var(--ln);padding:20px 14px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.lg{background:#fff;border-radius:14px;width:76px;height:76px;display:grid;place-items:center;margin:0 auto 4px;border:1px solid var(--ln)}
.lg img{width:64px;height:64px;object-fit:contain}
.lg.big{width:110px;height:110px}.lg.big img{width:96px;height:96px}
aside h1{font-size:15px;text-align:center;margin:0 0 14px;line-height:1.3}
aside h1 span{color:var(--pu)}
.nv{display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;color:var(--tx);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;text-align:left}
.nv:hover{background:var(--bg)}.nv.on{background:var(--pu);color:#fff}
.bd{background:var(--or);color:#fff;border-radius:99px;font-style:normal;font-size:12px;padding:0 8px;font-weight:700}
.me{margin-top:auto;border-top:1px solid var(--ln);padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.me button{border:0;background:none;color:var(--pu);cursor:pointer;font:inherit;font-weight:700}
main{flex:1;overflow:auto;padding:28px 32px}
main>*{max-width:1080px}
h2{margin:0 0 16px;font-size:22px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:16px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.ac{display:flex;gap:8px;align-items:center}
.mu{color:var(--mu);font-size:13px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 14px}
.tbl th{text-align:left;color:var(--mu);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--ln)}
.tbl td{padding:8px;border-bottom:1px solid var(--ln)}
input,select{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pu);outline-offset:1px}
label{display:block;font-weight:500;margin:0 0 6px}
select{max-width:320px;margin-bottom:14px}
.row{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.btn{background:var(--pu);color:#fff;border:1px solid var(--pu);border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;display:inline-block}
.btn.sec{background:transparent;color:var(--pu);font-weight:500;margin:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:16px}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;color:#fff;white-space:nowrap}
.pill.gr{background:var(--gr)}.pill.or{background:var(--or)}.pill.cy{background:var(--cy)}
.tg{border:1px solid var(--ln);background:transparent;color:var(--tx);padding:5px 12px;border-radius:8px;cursor:pointer;margin-right:6px;font:inherit}
.tg.on{color:#fff}.tg.on.gr{background:var(--gr);border-color:var(--gr)}.tg.on.or{background:var(--or);border-color:var(--or)}
.err{color:var(--or);margin:6px 0}
.lgn{display:grid;place-items:center;width:100%;padding:20px}
.lgn .card{width:380px;max-width:100%}
.lgn h1{text-align:center;font-size:20px;margin:6px 0 20px}
.lgn select{max-width:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px}
.tile b{font-size:26px;display:block}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bar{display:grid;grid-template-columns:110px 1fr 30px;align-items:center;gap:8px;margin:8px 0}
.bar i{display:block;height:10px;border-radius:6px}
.fl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fl select,.fl input{width:auto;margin:0;max-width:200px}

const pend=()=>S.r.filter(r=>r.to===me&&!r.done).length;

function login(){
 return `<div class="lgn"><div class="card"><div class="lg big"><img src="${LOGO}" alt=""></div><h1>Zahrat Haneen Transfers</h1>
 <label for="u">Username</label><input id="u" value="${esc(lu)}" autocomplete="username" style="margin-bottom:14px">
 <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" style="margin-bottom:14px">
 <button class="btn" data-a="in" style="width:100%">Sign in</button>
 ${msg?`<p class="err">${msg}</p>`:""}</div></div>`;
}
const tg=(r,k,i)=>["d","w"].map(v=>`<button class="tg ${i.t===v?"on "+(v==="d"?"gr":"or"):""}" data-a="set" data-id="${r.id}" data-k="${k}" data-v="${v}">${P[v][0]}</button>`).join("");
function card(r,m){
 const all=r.items.every(i=>i.t);
 const who=m==="recv"?`From <b>${esc(r.from)}</b>`:m==="sent"?`To <b>${esc(r.to)}</b>`:m==="arch"?(r.from===me?`Sent to <b>${esc(r.to)}</b>`:`Received from <b>${esc(r.from)}</b>`):`<b>${esc(r.from)}</b> → <b>${esc(r.to)}</b>`;
 const st=r.done?`<span class="pill gr">Answered</span>`:`<span class="pill cy">Waiting for reply</span>`;
 const act=m==="recv"?`<button class="btn sec" data-a="all" data-id="${r.id}">Mark all Done</button><button class="btn" data-a="sub" data-id="${r.id}" ${all?"":"disabled"}>Submit results</button>`:(m==="sent"&&r.done?`<button class="btn sec" data-a="hide" data-id="${r.id}">Archive</button>`:"");
 const rows=r.items.map((i,k)=>`<tr><td>${esc(i.c)}</td><td>${esc(i.n)}</td><td>${esc(i.q)}</td><td>${m==="recv"?tg(r,k,i):pill(i.s)}</td></tr>`).join("");
 return `<div class="card"><div class="hd"><div>${who}<div class="mu">${fmt(r.ts)}</div></div><div class="ac">${m==="recv"?"":st}${act}</div></div>
 <table class="tbl"><tr><th>Code</th><th>Item name</th><th>Qty</th><th>${m==="recv"?"Result":"Status"}</th></tr>${rows}</table></div>`;
}
const list=(t,a,m,e)=>`<h2>${t}</h2>`+(a.length?a.map(r=>card(r,m)).join(""):`<p class="mu">${e}</p>`);
function vSend(){
 if(!toSel||toSel===me)toSel=BR.find(x=>x!==me);
 const opts=BR.filter(x=>x!==me).map(x=>`<option ${x===toSel?"selected":""}>${x}</option>`).join("");
 const rows=draft.map((i,k)=>`<tr><td><input data-k="${k}" data-f="c" value="${esc(i.c)}"></td><td><input data-k="${k}" data-f="n" value="${esc(i.n)}"></td><td><input type="number" min="1" data-k="${k}" data-f="q" value="${esc(i.q)}" style="width:90px"></td><td><button class="x" data-a="del" data-k="${k}" aria-label="Remove item">✕</button></td></tr>`).join("");
 return `<h2>New request</h2><div class="card"><label for="to">Request items from</label><select id="to">${opts}</select>
 <div class="row"><label class="btn sec" style="margin:0">Import Excel<input type="file" id="f" accept=".xlsx,.xls,.csv" hidden></label><button class="btn sec" data-a="add">Add item</button><button class="btn sec" data-a="tpl">Download template</button></div>
 <p class="mu">Excel columns: Code, Item name, Quantity</p>${note?`<p class="err">${note}</p>`:""}
 ${draft.length?`<table class="tbl"><tr><th>Code</th><th>Item name</th><th>Qty</th><th></th></tr>${rows}</table>`:`<p class="mu">Import a sheet or add items to start.</p>`}
 <button class="btn" data-a="send">Send request</button></div>`;
}
const bars=(o,c)=>{const e=Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5);if(!e.length)return `<p class="mu">No data yet.</p>`;const m=e[0][1];return e.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/m*100}%;background:var(--${c})"></i><b>${v}</b></div>`).join("")};
function vDash(){
 const A=S.r,its=A.flatMap(r=>r.items),n=k=>its.filter(i=>i.s===k).length,ans=n("d")+n("w");
 const pc=k=>ans?Math.round(n(k)/ans*100)+"%":"-";
 const bf={},bw={};A.forEach(r=>{bf[r.from]=(bf[r.from]||0)+1;const w=r.items.filter(i=>i.s==="w").length;if(w)bw[r.to]=(bw[r.to]||0)+w});
 const sel=(id,arr,v,all)=>`<select id="${id}"><option value="">${all}</option>${arr.map(x=>`<option value="${x[0]}" ${x[0]===v?"selected":""}>${x[1]}</option>`).join("")}</select>`;
 const bo=BR.map(x=>[x,x]);
 const F=window._F=A.filter(r=>(!flt.f||r.from===flt.f)&&(!flt.t||r.to===flt.t)&&(!flt.d||r.day===flt.d)&&(!flt.s||(flt.s==="p"?!r.done:r.done)));
 return `<h2>Dashboard</h2><div class="tiles"><div class="tile"><b>${A.length}</b><span class="mu">Requests</span></div><div class="tile"><b>${its.length}</b><span class="mu">Items requested</span></div><div class="tile"><b style="color:var(--gr)">${pc("d")}</b><span class="mu">Done</span></div><div class="tile"><b style="color:var(--or)">${pc("w")}</b><span class="mu">Wrong balance</span></div><div class="tile"><b style="color:var(--cy)">${A.filter(r=>!r.done).length}</b><span class="mu">Waiting for reply</span></div></div>
 <div class="two"><div class="card"><b>Branches requesting most</b>${bars(bf,"pu")}</div><div class="card"><b>Wrong balance items by supplying branch</b>${bars(bw,"or")}</div></div>
 <h2>All transfers</h2><div class="fl">${sel("f_f",bo,flt.f,"Any requesting branch")}${sel("f_t",bo,flt.t,"Any supplying branch")}<input type="date" id="f_d" value="${flt.d}" aria-label="Date">${sel("f_s",[["p","Waiting for reply"],["a","Answered"]],flt.s,"Any status")}<button class="btn sec" data-a="export">Export to Excel</button></div>
 ${F.length?F.map(r=>card(r,"adm")).join(""):`<p class="mu">No transfers match these filters.</p>`}`;
}
function view(){
 if(location.hash==="#setup")return setupView();
 if(!me)return login();
 const adm=me==="Admin",pin=pend();
 const T=adm?[["dash","Dashboard",0]]:[["send","New request",0],["req","My requests",0],["recv","Receive",pin],["arch","Archive",0]];
 let b;
 if(tab==="send")b=vSend();
 else if(tab==="req")b=list("My requests",S.r.filter(r=>r.from===me&&sentActive(r)),"sent","No active requests. Send one from New request.");
 else if(tab==="recv")b=list("Receive",S.r.filter(r=>r.to===me&&!r.done),"recv","No incoming requests.");
 else if(tab==="arch")b=list("Archive",S.r.filter(r=>(r.from===me&&!sentActive(r))||(r.to===me&&r.done)),"arch","The archive is empty.");
 else b=vDash();
 return `<aside><div class="lg"><img src="${LOGO}" alt=""></div><h1>Zahrat Haneen<br><span>Transfers</span></h1>
 ${T.map(t=>`<button class="nv ${tab===t[0]?"on":""}" data-a="tab" data-v="${t[0]}">${t[1]}${t[2]?`<i class="bd">${t[2]}</i>`:""}</button>`).join("")}
 <div class="me"><b>${esc(me)}</b><button data-a="out">Log out</button></div></aside><main>${b}</main>`;
}
function render(){
 $("#app").innerHTML=view();
 document.title=(me&&me!=="Admin"&&pend()?`(${pend()}) `:"")+"Zahrat Haneen Transfers";
}
function setupView(){return `<div class="lgn"><div class="card"><h1>One-time setup</h1><p class="mu">Creates the 15 accounts with random passwords. Copy them now; they are shown only once.</p><div class="row"><button class="btn" data-a="setup">Create accounts</button><button class="btn sec" data-a="copy">Copy passwords</button></div><pre style="white-space:pre-wrap">${esc(setupOut)}</pre></div></div>`}
async function runSetup(){
 const A="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 setupOut="Working...";render();let out="";
 for(const u of [...BU,"admin"]){
  const p=Array.from(crypto.getRandomValues(new Uint8Array(10)),x=>A[x%A.length]).join("");
  try{await createUserWithEmailAndPassword(auth,u+"@zht.app",p);out+=u+"  "+p+"\n"}
  catch(e){out+=u+"  "+(e.code==="auth/email-already-in-use"?"already exists":e.code)+"\n"}
 }
 await signOut(auth);setupOut=out;render();
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;
 const a=b.dataset.a,r=S.r.find(x=>x.id===b.dataset.id),k=+b.dataset.k;
 if(a==="in"){lu=$("#u").value.trim().toLowerCase();msg="";signInWithEmailAndPassword(auth,lu+"@zht.app",$("#p").value).catch(()=>{msg="Wrong username or password.";render()});return}
 else if(a==="out"){signOut(auth);draft=[];return}
 else if(a==="setup"){runSetup();return}
 else if(a==="copy"){if(navigator.clipboard)navigator.clipboard.writeText(setupOut);return}
 else if(a==="tpl"){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Code","Item name","Quantity"]]),"Transfer");XLSX.writeFile(wb,"transfer-template.xlsx");return}
 else if(a==="export"){const rows=[["Date","From","To","Code","Item","Qty","Status"]];(window._F||[]).forEach(r=>r.items.forEach(i=>rows.push([r.day,r.from,r.to,i.c,i.n,i.q,P[i.s][0]])));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Transfers");XLSX.writeFile(wb,"transfers-report.xlsx");return}
 else if(a==="tab"){tab=b.dataset.v;note=""}
 else if(a==="add")draft.push({c:"",n:"",q:1});
 else if(a==="del")draft.splice(k,1);
 else if(a==="samp")draft=[{c:"1001",n:"Vitamin C Serum 30ml",q:12},{c:"1002",n:"Sunscreen SPF50 50ml",q:8},{c:"1003",n:"Hydrating Cleanser 200ml",q:20}];
 else if(a==="send"){
  const it=draft.filter(i=>(i.c||i.n)&&+i.q>0);
  if(!it.length){note="Add at least one item with a quantity.";return render()}
  addDoc(collection(db,"requests"),{from:me,fromU:meU,to:toSel,toU:BU[BR.indexOf(toSel)],day:today(),ts:Date.now(),items:it.map(i=>({c:String(i.c).trim(),n:String(i.n).trim(),q:+i.q,s:"p"})),done:false,hid:false}).catch(e=>alert("Could not send: "+e.message));
  draft=[];note="";tab="req"}
 else if(a==="set"&&r){r.items[k].t=b.dataset.v;upd(r,{items:r.items})}
 else if(a==="all"&&r){r.items.forEach(i=>i.t="d");upd(r,{items:r.items})}
 else if(a==="sub"&&r&&r.items.every(i=>i.t)){r.items.forEach(i=>i.s=i.t);r.done=true;upd(r,{items:r.items,done:true,doneTs:Date.now()})}
 else if(a==="hide"&&r){r.hid=true;upd(r,{hid:true})}
 render();
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.f&&draft[+t.dataset.k])draft[+t.dataset.k][t.dataset.f]=t.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="p")document.querySelector('[data-a="in"]').click()});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="to"){toSel=t.value}
 else if(t.id&&t.id.startsWith("f_")&&t.id!=="f_x"){flt[t.id.slice(2)]=t.value;render()}
 else if(t.id==="f"&&t.files[0]){
  const rd=new FileReader();
  rd.onload=ev=>{note="";try{
   const wb=XLSX.read(ev.target.result,{type:"array"});
   const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
   rows.forEach((x,i)=>{if(i===0&&isNaN(+x[2]))return;if(x[0]===""&&x[1]==="")return;draft.push({c:String(x[0]).trim(),n:String(x[1]).trim(),q:+x[2]||1})});
  }catch(err){note="Could not read this file. Use an .xlsx or .csv with the columns Code, Item name, Quantity."}render()};
  rd.readAsArrayBuffer(t.files[0]);
 }
});
addEventListener("hashchange",render);
onAuthStateChanged(auth,u=>{
 unsubs.forEach(f=>f());unsubs=[];parts={};S.r=[];
 if(!u){me=null;meU="";return render()}
 meU=u.email.split("@")[0];me=meU==="admin"?"Admin":BR[BU.indexOf(meU)];
 if(!me){signOut(auth);return}
 tab=me==="Admin"?"dash":"send";
 const col=collection(db,"requests"),er=e=>alert("Could not load data: "+e.message);
 const put=k=>sn=>{parts[k]=sn.docs.map(d=>({...d.data(),id:d.id}));S.r=Object.values(parts).flat().filter((x,j,a)=>a.findIndex(y=>y.id===x.id)===j).sort((a,b)=>b.ts-a.ts);const el=document.activeElement;if(!el||!el.matches("#app input,#app select"))render()};
 unsubs=me==="Admin"?[onSnapshot(col,put("a"),er)]:[onSnapshot(query(col,where("fromU","==",meU)),put("f"),er),onSnapshot(query(col,where("toU","==",meU)),put("t"),er)];
 render();
});
render();
</script></body></html>
